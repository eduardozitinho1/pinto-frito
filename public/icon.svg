<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="chickenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="245" r="160" fill="#f59e0b" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Fried Chicken Drumstick Graphic -->
  <g transform="translate(256, 240) rotate(-35) translate(-120, -120)">
    <!-- Bone End Knobs -->
    <circle cx="65" cy="195" r="18" fill="url(#boneGrad)" />
    <circle cx="85" cy="208" r="18" fill="url(#boneGrad)" />
    <!-- Bone shaft -->
    <path d="M 68 185 L 105 130 L 125 142 L 88 198 Z" fill="url(#boneGrad)" />

    <!-- Crispy Golden Chicken Meat Bulb -->
    <!-- Crisp bumpy silhouette -->
    <path d="M 95 135 
             C 80 110, 85 75, 115 50 
             C 145 25, 195 20, 225 55 
             C 250 85, 255 135, 230 170 
             C 205 200, 160 215, 125 195 
             C 105 180, 100 155, 95 135 Z" 
          fill="url(#chickenGrad)" />

    <!-- Crispy flakes & seasoning dots -->
    <circle cx="160" cy="70" r="5" fill="#ffffff" fill-opacity="0.6" />
    <circle cx="190" cy="90" r="6" fill="#ffffff" fill-opacity="0.5" />
    <circle cx="140" cy="115" r="4.5" fill="#ffffff" fill-opacity="0.5" />
    <circle cx="180" cy="140" r="5" fill="#ffffff" fill-opacity="0.4" />
    <circle cx="130" cy="80" r="3.5" fill="#78350f" fill-opacity="0.6" />
    <circle cx="170" cy="115" r="4" fill="#78350f" fill-opacity="0.6" />
    <circle cx="210" cy="110" r="3.5" fill="#78350f" fill-opacity="0.6" />
    <circle cx="150" cy="160" r="4" fill="#78350f" fill-opacity="0.6" />
  </g>

  <!-- Brand Signature Text Badge -->
  <rect x="136" y="395" width="240" height="42" rx="21" fill="#f59e0b" />
  <text x="256" y="423" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#0c0a09" text-anchor="middle" letter-spacing="2">PINTO FRITO</text>
</svg>
